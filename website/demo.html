<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo — FIFO</title>
    <meta name="description" content="Upload a PDF and preview it in the browser." />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div class="page">
      <header class="nav">
        <a href="about.html" class="logo">FIFO</a>
        <nav class="nav-links">
          <a href="about.html#about">About</a>
          <a href="about.html#goal">Our goal</a>
          <a href="about.html#product">Product</a>
          <a href="about.html#who">Who we are</a>
        </nav>
        <div class="nav-cta">
          <a class="primary" href="demo.html">Try our demo</a>
        </div>
      </header>

      <main>
        <section class="section demo-shell">
          <div class="section-title demo-title">
            <p class="eyebrow">Demo</p>
            <h2>Upload a PDF statement</h2>
            <p class="subhead">Upload your statement PDF to begin.</p>
          </div>

          <div class="demo-simple">
            <label class="upload upload-cta">
              <input id="pdfInput" type="file" accept="application/pdf" />
              <span id="uploadLabel">Upload PDF</span>
            </label>
            <div class="demo-meta" id="pdfMeta">No file selected.</div>
            <div class="demo-meta" id="parseMeta"></div>
          </div>

          <div id="results" class="results" hidden>
            <div class="results-head">
              <h3>Parsed results</h3>
              <p id="resultsInfo" class="demo-meta"></p>
            </div>
            <div class="results-summary" id="resultsSummary"></div>
            <div class="category-block" id="categoryBlock">
              <div class="category-title">Categories</div>
              <div class="results-summary category-summary" id="categorySummary"></div>
            </div>
            <div id="categoryTotal" class="category-total" hidden></div>
            <div class="results-table-wrap">
              <table class="results-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Merchant</th>
                    <th>Amount</th>
                  </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="logo">FIFO</div>
        <div class="footer-links"></div>
        <div class="footer-note">© 2026 FIFO. All rights reserved.</div>
      </footer>
    </div>

    <script>
      const input = document.getElementById("pdfInput");
      const meta = document.getElementById("pdfMeta");
      const parseMeta = document.getElementById("parseMeta");
      const uploadLabel = document.getElementById("uploadLabel");
      const uploadCta = document.querySelector(".upload-cta");
      const results = document.getElementById("results");
      const resultsInfo = document.getElementById("resultsInfo");
      const resultsSummary = document.getElementById("resultsSummary");
      const resultsBody = document.getElementById("resultsBody");
      const categorySummary = document.getElementById("categorySummary");
      const categoryBlock = document.getElementById("categoryBlock");
      const categoryTotal = document.getElementById("categoryTotal");

      let lastPayload = null;
      let activeCategory = "All";

      function setUploadState(state) {
        uploadCta.classList.remove("is-uploaded", "is-loading", "is-error");
        if (state === "uploaded") uploadCta.classList.add("is-uploaded");
        if (state === "loading") uploadCta.classList.add("is-loading");
        if (state === "error") uploadCta.classList.add("is-error");
      }

      // Backend that parses the PDF and returns JSON.
      const CLOUD_API_BASE = "https://finance-demo-558632999562.us-central1.run.app";

      async function postParse(formData, baseUrl) {
        const res = await fetch(`${baseUrl}/api/parse`, { method: "POST", body: formData });
        if (!res.ok) {
          let errMsg = "";
          const contentType = res.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            const err = await res.json().catch(() => ({}));
            errMsg = err.error || "";
          }
          if (!errMsg && (res.status === 404 || res.status === 405)) {
            errMsg = "Backend parse API not available.";
          }
          if (!errMsg) {
            errMsg = `Parsing failed (HTTP ${res.status})`;
          }
          const error = new Error(errMsg);
          error.status = res.status;
          throw error;
        }
        return res.json();
      }

      function renderSummary(payload) {
        const dynamicCards = Array.isArray(payload.summary_cards) ? payload.summary_cards : [];
        if (dynamicCards.length) {
          resultsSummary.innerHTML = dynamicCards
            .map((card) => {
              const label = card.label || card.key || "Summary";
              const value = card.amount || "-";
              return `<div class="result-card"><div class="result-label">${label}</div><div class="result-value">${value}</div></div>`;
            })
            .join("");
          return;
        }
        const summary = payload.account_summary || {};
        const income = summary.deposits_additions || "-";
        const expenses = summary.withdrawals_subtractions || "-";
        const fees = summary.service_fees || "-";
        const cards = [
          ["Beginning Balance", summary.beginning_balance || "-"],
          ["Income", income],
          ["Expenses", expenses],
          ["Service Fees", fees],
          ["Ending Balance", summary.ending_balance || "-"],
        ];
        resultsSummary.innerHTML = cards
          .map(
            ([label, value]) =>
              `<div class="result-card"><div class="result-label">${label}</div><div class="result-value">${value}</div></div>`
          )
          .join("");
      }

      function parseAmount(amountStr) {
        if (!amountStr) return null;
        const s = String(amountStr).replace(/[$,\s]/g, "");
        const n = parseFloat(s);
        return isNaN(n) ? null : n;
      }

      function renderTransactions(payload, categoryFilter = "All") {
        const txns = payload.transactions || [];
        const filteredTxns =
          categoryFilter && categoryFilter !== "All"
            ? txns.filter((t) => (t.category || "Uncategorized") === categoryFilter)
            : txns;

        // Show total spending for the selected category
        if (categoryFilter && categoryFilter !== "All") {
          let total = 0;
          filteredTxns.forEach((t) => {
            let amount = t.amount || "";
            const type = (t.txn_type || "").toLowerCase();
            if (amount && (type === "withdrawals" || type === "fee")) {
              if (!String(amount).startsWith("-") && !String(amount).startsWith("(")) {
                amount = `-${amount}`;
              }
            }
            const n = parseAmount(amount);
            if (n !== null) total += n;
          });
          const sign = total < 0 ? "-" : total > 0 ? "+" : "";
          const formatted = `$${Math.abs(total).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          categoryTotal.textContent = `${categoryFilter}: ${sign}${formatted} across ${filteredTxns.length} transaction${filteredTxns.length !== 1 ? "s" : ""}`;
          categoryTotal.hidden = false;
        } else {
          categoryTotal.hidden = true;
        }

        const categoryCounts = {};
        resultsBody.innerHTML = filteredTxns
          .map(
            (t) => {
              let amount = t.amount || "";
              const type = (t.txn_type || "").toLowerCase();
              if (amount && (type === "withdrawals" || type === "fee")) {
                if (!amount.startsWith("-") && !amount.startsWith("(")) {
                  amount = `-${amount}`;
                }
              }
              const raw = t.raw_description || "";
              let merchant = t.merchant_clean || raw || "";
              const rawUpper = raw.toUpperCase();
              const merchUpper = merchant.toUpperCase();
              if (rawUpper.includes("VENMO") && !merchUpper.includes("VENMO")) {
                merchant = `VENMO ${merchant}`.trim();
              }
              if (rawUpper.includes("ZELLE") && !merchUpper.includes("ZELLE")) {
                merchant = `ZELLE ${merchant}`.trim();
              }
              const category = t.category || "Uncategorized";
              const rawEscaped = (t.raw_description || "").replace(/"/g, "&quot;");
              return `<tr class="txn-row" onclick="toggleTxnDetail(this)"><td>${t.date || ""}</td><td>${merchant}</td><td>${amount}</td></tr><tr class="txn-detail" hidden><td colspan="3" class="txn-raw">Raw: ${t.raw_description || ""}</td></tr>`;
            }
          )
          .join("");
        txns.forEach((t) => {
          const category = t.category || "Uncategorized";
          categoryCounts[category] = (categoryCounts[category] || 0) + 1;
        });
        const orderedCategories = Object.keys(categoryCounts).sort();
        if (!orderedCategories.length) {
          categoryBlock.hidden = true;
          return;
        }
        categoryBlock.hidden = false;
        const allCard = `<div class="result-card${
          categoryFilter === "All" ? " is-active" : ""
        }" data-category="All"><div class="result-label">All</div><div class="result-value">${
          txns.length
        }</div></div>`;
        categorySummary.innerHTML =
          allCard +
          orderedCategories
            .map((category) => {
              const active = categoryFilter === category ? " is-active" : "";
              return `<div class="result-card${active}" data-category="${category}"><div class="result-label">${category}</div><div class="result-value">${categoryCounts[category]}</div></div>`;
            })
            .join("");
      }

      input.addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          meta.textContent = "No file selected.";
          parseMeta.textContent = "";
          uploadLabel.textContent = "Upload PDF";
          setUploadState("");
          results.hidden = true;
          return;
        }
        if (file.type !== "application/pdf") {
          meta.textContent = "Please choose a PDF file.";
          parseMeta.textContent = "";
          uploadLabel.textContent = "Upload PDF";
          setUploadState("error");
          results.hidden = true;
          return;
        }
        meta.textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(2)} MB`;
        uploadLabel.textContent = "PDF uploaded";
        setUploadState("uploaded");
        parseMeta.textContent = "Parsing statement...";
        setUploadState("loading");

        const formData = new FormData();
        formData.append("file", file, file.name);

        const tryLocalFirst = async () => {
          try {
            const payload = await postParse(formData, "");
            return { payload, backend: "local" };
          } catch (err) {
            const msg = String(err && err.message ? err.message : "");
            const status = Number(err && err.status ? err.status : 0);
            if (
              msg.includes("Failed to fetch") ||
              msg.includes("Load failed") ||
              msg.includes("Backend parse API not available") ||
              status === 404 ||
              status === 405
            ) {
              const payload = await postParse(formData, CLOUD_API_BASE);
              return { payload, backend: "cloud" };
            }
            throw err;
          }
        };

        // Send PDF to the backend API for parsing (local first, then cloud fallback).
        tryLocalFirst()
          .then(({ payload, backend }) => {
            setUploadState("uploaded");
            parseMeta.textContent =
              backend === "cloud"
                ? "Parsed successfully (cloud backend)."
                : "Parsed successfully (local backend).";
            results.hidden = false;
            const count = (payload.transactions || []).length;
            resultsInfo.textContent = `${count} transactions extracted`;
            lastPayload = payload;
            activeCategory = "All";
            renderSummary(payload);
            renderTransactions(payload, activeCategory);
          })
          .catch((err) => {
            setUploadState("error");
            const msg = String(err && err.message ? err.message : "");
            const friendly =
              msg.includes("Failed to fetch") || msg.includes("Load failed")
                ? "Backend is not reachable. Check the API URL."
                : `Could not parse PDF: ${msg}`;
            parseMeta.textContent = friendly;
            results.hidden = true;
          });
      });

      function toggleTxnDetail(row) {
        const detail = row.nextElementSibling;
        if (detail && detail.classList.contains("txn-detail")) {
          detail.hidden = !detail.hidden;
          row.classList.toggle("is-expanded", !detail.hidden);
        }
      }

      categorySummary.addEventListener("click", (event) => {
        const card = event.target.closest("[data-category]");
        if (!card || !lastPayload) {
          return;
        }
        activeCategory = card.getAttribute("data-category") || "All";
        renderTransactions(lastPayload, activeCategory);
      });
    </script>
  </body>
</html>
