<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFO Bank Connector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #1a1a1a;
    }
    .header {
      background: #1f5f55;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo { font-size: 22px; }
    .header h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .header p  { font-size: 11px; opacity: .8; margin-top: 2px; }
    .body { padding: 14px 16px; }
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #888;
      margin-bottom: 8px;
    }
    .bank-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      transition: border-color .15s, background .15s;
      margin-bottom: 8px;
    }
    .bank-btn:hover { border-color: #1f5f55; background: #f0faf8; }
    .bank-btn .icon { font-size: 20px; flex-shrink: 0; }
    .bank-btn .sub { font-size: 11px; font-weight: 400; color: #666; }
    .bank-btn.coming-soon { opacity: .45; cursor: not-allowed; }
    .bank-btn.coming-soon:hover { border-color: #e5e7eb; background: #fff; }
    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }
    .status.info    { background: #eff6ff; color: #1d4ed8; display: block; }
    .status.success { background: #f0fdf4; color: #166534; display: block; }
    .status.error   { background: #fef2f2; color: #991b1b; display: block; }
    .footer {
      border-top: 1px solid #f3f4f6;
      padding: 10px 16px;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }
    .footer a { color: #1f5f55; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h1>FIFO Bank Connector</h1>
      <p>Sync transactions from your own browser</p>
    </div>
  </div>

  <div class="body">
    <div class="label">Sync a bank</div>

    <button class="bank-btn" id="btn-boa" data-bank="boa">
      <span class="icon">🏦</span>
      <div>
        <div>Bank of America</div>
        <div class="sub">Checking &amp; savings</div>
      </div>
    </button>

    <button class="bank-btn coming-soon" disabled>
      <span class="icon">💳</span>
      <div>
        <div>Capital One</div>
        <div class="sub">Coming soon</div>
      </div>
    </button>

    <button class="bank-btn coming-soon" disabled>
      <span class="icon">🔵</span>
      <div>
        <div>Discover</div>
        <div class="sub">Coming soon</div>
      </div>
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    Open <a href="#" id="open-fifo">FIFO app</a> to view your transactions
  </div>

  <script src="popup.js"></script>
</body>
</html>
