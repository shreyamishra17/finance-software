name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      # Only redeploy when backend code actually changes
      - 'src/**'
      - 'core/**'
      - 'bank_fetcher/**'
      - 'api/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build --no-cache -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/finance-demo/finance-demo:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/finance-demo/finance-demo:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy finance-demo \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/finance-demo/finance-demo:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --port 8000 \
            --set-env-vars "PERSIST_MODE=firebase_storage,FIREBASE_STORAGE_BUCKET=financesoftware-487822.firebasestorage.app,FIRESTORE_DATABASE=finance-database"
