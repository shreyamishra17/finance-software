name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      # Only redeploy when backend code actually changes
      - 'src/**'
      - 'core/**'
      - 'bank_fetcher/**'
      - 'api/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/finance-demo .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/finance-demo

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy finance-demo \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/finance-demo \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 3 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --port 8000
